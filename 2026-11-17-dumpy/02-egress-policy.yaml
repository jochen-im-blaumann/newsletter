apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shop-egress
  namespace: shop
spec:
  podSelector:
    matchLabels:
      app: shop
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 8080
