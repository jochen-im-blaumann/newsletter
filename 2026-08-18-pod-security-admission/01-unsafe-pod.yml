apiVersion: v1
kind: Pod
metadata:
  name: unsafe-app
  namespace: psa-demo
spec:
  containers:
  - name: app
    image: nginx:alpine
    securityContext:
      runAsUser: 0
      allowPrivilegeEscalation: true
      capabilities:
        add: ["NET_RAW"]
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
