<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="320" fill="#ffffff"/>

  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">OPA Gatekeeper vs. Kyverno</text>

  <!-- Gatekeeper column -->
  <rect x="30" y="55" width="300" height="245" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="180" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">OPA Gatekeeper</text>

  <text x="50" y="112" font-size="12" fill="#78350f">• Policy-Sprache: Rego (eigene DSL)</text>
  <text x="50" y="137" font-size="12" fill="#78350f">• 2 Objekte: ConstraintTemplate</text>
  <text x="62" y="155" font-size="12" fill="#78350f">  + Constraint</text>
  <text x="50" y="180" font-size="12" fill="#78350f">• Stärke: sehr mächtig, komplexe</text>
  <text x="62" y="198" font-size="12" fill="#78350f">  Logik möglich</text>
  <text x="50" y="223" font-size="12" fill="#78350f">• Mutation: nachträglich, komplexer</text>
  <text x="50" y="248" font-size="12" fill="#78350f">• Lernkurve: Rego muss man erst</text>
  <text x="62" y="266" font-size="12" fill="#78350f">  lernen</text>

  <!-- Kyverno column -->
  <rect x="370" y="55" width="300" height="245" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="520" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Kyverno</text>

  <text x="390" y="112" font-size="12" fill="#14532d">• Policy-Sprache: reines YAML</text>
  <text x="390" y="137" font-size="12" fill="#14532d">• 1 Objekt: ClusterPolicy</text>
  <text x="390" y="162" font-size="12" fill="#14532d">• Stärke: validate, mutate und</text>
  <text x="402" y="180" font-size="12" fill="#14532d">  generate in einem Objekt</text>
  <text x="390" y="205" font-size="12" fill="#14532d">• Mutation: nativ und einfach</text>
  <text x="402" y="223" font-size="12" fill="#14532d">  (Label automatisch ergänzen)</text>
  <text x="390" y="248" font-size="12" fill="#14532d">• Lernkurve: kennst du schon —</text>
  <text x="402" y="266" font-size="12" fill="#14532d">  ist YAML wie alles andere</text>
</svg>
